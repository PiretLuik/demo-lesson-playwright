name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Verify environment variables
      - name: Verify environment variables
        run: |
          echo "Verifying environment variables..."
          echo "URL: ${{ secrets.URL }}"
          echo "TEST_USERNAME: ${{ secrets.TEST_USERNAME }}"
          echo "TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}"
        env:
          URL: ${{ secrets.URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      # Run ESLint check
      - name: Run ESLint check
        run: |
          echo "Running ESLint to check for linting issues..."
          npm run lint

      # Run Prettier check
      - name: Run Prettier check
        run: |
          echo "Running Prettier to check for formatting issues..."
          npm run check

      # Install Playwright Browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Run Playwright tests
      - name: Run Playwright tests
        env:
          URL: ${{ secrets.URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test

      # Upload test report as artifact
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

